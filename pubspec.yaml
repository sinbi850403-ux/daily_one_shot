name: daily_one_shot
description: "하루 한 장 — 평생소장 사진 일기"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Data layer
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Media & device
  image_picker: ^1.1.2
  image: ^4.2.0
  local_auth: ^2.3.0

  # Backup
  archive: ^4.0.0

  # Widgets
  home_widget: ^0.7.0

  # IAP
  in_app_purchase: ^3.2.0

  # Ads
  google_mobile_ads: ^5.3.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # Location & Weather
  geolocator: ^13.0.2

  # PDF
  pdf: ^3.11.1

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utils
  intl: ^0.19.0

dependency_overrides:
  # pub cache repair 후 Dart 빌드 시스템이 읽지 못하는 문제 우회 (로컬 복사본 사용)
  archive:
    path: ./local_packages/archive
  image:
    path: ./local_packages/image

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.2
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#B07850"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
